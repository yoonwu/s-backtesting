name: trader-tests

# 봇 주문 경로 시나리오 테스트 (가짜 계좌 — 네트워크·실계좌 접근 없음).
# 주의: test_order.py / test_moc.py 는 실계좌 주문 스크립트라 절대 여기서 돌리지 않는다
#       → discover 패턴을 test_trader.py 하나로 고정.
on:
  push:
    paths:
      - "volswitch/trader/**"
      - "volswitch/daily_signal.py"
      - ".github/workflows/trader-tests.yml"
  pull_request:
    paths:
      - "volswitch/trader/**"
      - "volswitch/daily_signal.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pandas yfinance requests
      - name: Scenario tests
        run: python -m unittest discover -s volswitch/trader -p "test_trader.py" -v
